<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Snake — Play Online</title>
<style>
  :root{
    --bg:#0b1220;
    --cell:#9be15d;
    --food:#ff6b6b;
    --panel:#0f1720;
    --muted:#95a0b3;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:#fff;display:flex;align-items:center;justify-content:center;}
  .wrap{width:min(760px,95vw);display:grid;grid-template-columns:1fr 260px;gap:18px;padding:20px;}
  .game{background:linear-gradient(180deg,#07101a 0%, #071722 100%);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background: #0b1220; border-radius:8px; display:block; image-rendering:pixelated;}
  .panel{background:var(--panel);border-radius:12px;padding:16px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
  h1{font-size:18px;margin:0 0 8px 0;color:#e6eef8}
  .score{font-weight:700;color:var(--cell);font-size:20px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#111827;border:1px solid #1f2937;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
  button.primary{background:var(--cell);color:#042016;border:none}
  .kbd{display:inline-block;padding:6px 8px;border-radius:6px;background:#081020;border:1px solid #0e1620;color:#9fb3c2;font-size:13px}
  .footer{font-size:13px;color:var(--muted);margin-top:8px}
  @media (max-width:760px){ .wrap{grid-template-columns:1fr; } .panel{order:2} }
  /* touch area */
  .touch-row{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .touch-btn{width:52px;height:52px;border-radius:10px;background:#0f1720;border:1px solid #1f2937;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="game">
    <h1>Snake — Play Online</h1>
    <canvas id="c" width="480" height="480"></canvas>
    <div class="touch-row" id="touchControls" style="display:none;">
      <div class="touch-btn" id="left">◀</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="touch-btn" id="up">▲</div>
        <div class="touch-btn" id="down">▼</div>
      </div>
      <div class="touch-btn" id="right">▶</div>
    </div>
    <div class="footer">Use arrow keys / WASD. Tap controls appear on small screens.</div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:12px;color:var(--muted)">Score</div>
        <div class="score" id="score">0</div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--muted)">High</div>
        <div class="score" id="high">0</div>
      </div>
    </div>

    <div style="margin-top:6px;font-size:13px;color:var(--muted)">Speed</div>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="speed" type="range" min="4" max="20" value="10">
      <div id="speedVal" style="width:36px;text-align:center">10</div>
    </div>

    <div style="margin-top:10px">
      <div style="font-size:13px;color:var(--muted)">Board Size</div>
      <select id="size">
        <option value="20">20 × 20</option>
        <option value="24">24 × 24</option>
        <option value="30">30 × 30</option>
      </select>
    </div>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="start" class="primary">Start / Restart</button>
      <button id="pause">Pause</button>
    </div>

    <div style="margin-top:10px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Controls</div>
      <div class="controls">
        <span class="kbd">↑ / W</span>
        <span class="kbd">↓ / S</span>
        <span class="kbd">← / A</span>
        <span class="kbd">→ / D</span>
        <span class="kbd">Space — Pause</span>
      </div>
    </div>

    <div style="margin-top:12px">
      <div style="font-size:13px;color:var(--muted)">About</div>
      <div style="font-size:13px;color:#cfe8d6">Simple JS canvas snake. Deploy on Vercel & link from your GitHub profile.</div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const startBtn = document.getElementById('start');
  const pauseBtn = document.getElementById('pause');
  const speedRange = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const sizeSelect = document.getElementById('size');
  const touchControls = document.getElementById('touchControls');

  // detect small screen -> show touch
  if (window.matchMedia("(max-width:760px)").matches) touchControls.style.display = 'flex';

  speedRange.addEventListener('input', ()=>{ speed = Number(speedRange.value); speedVal.textContent = speedRange.value; });
  sizeSelect.addEventListener('change', ()=>{ initBoard(); });

  let grid = 20;
  let cellSize;
  let snake, dir, food, score, highScore, running, speed;
  let lastTick = 0;
  speed = Number(speedRange.value);
  speedVal.textContent = speed;

  function initBoard(){
    grid = Number(sizeSelect.value);
    // canvas square
    const side = Math.min(window.innerWidth*0.7, 480);
    canvas.width = side - (side % grid);
    canvas.height = canvas.width;
    cellSize = canvas.width / grid;
    reset();
  }

  function reset(){
    snake = [{x: Math.floor(grid/2), y: Math.floor(grid/2)}];
    dir = {x:1,y:0};
    placeFood();
    score = 0;
    running = false;
    scoreEl.textContent = score;
    highScore = Number(localStorage.getItem('snake-high') || 0);
    highEl.textContent = highScore;
  }

  function placeFood(){
    while(true){
      const x = Math.floor(Math.random()*grid);
      const y = Math.floor(Math.random()*grid);
      if (!snake.some(s=>s.x===x && s.y===y)){ food = {x,y}; break; }
    }
  }

  function step(){
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    // wrap-around
    head.x = (head.x + grid) % grid;
    head.y = (head.y + grid) % grid;

    // collision with self?
    if (snake.some(s=>s.x===head.x && s.y===head.y)){
      // game over
      running = false;
      if (score > highScore){ highScore = score; localStorage.setItem('snake-high', highScore); highEl.textContent = highScore; }
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function render(){
    // background
    ctx.fillStyle = '#07101a';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // draw food
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food') || '#ff6b6b';
    roundRect(ctx, food.x*cellSize+2, food.y*cellSize+2, cellSize-4, cellSize-4, 6, true);

    // draw snake
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--cell') || '#9be15d';
    for(let i=0;i<snake.length;i++){
      const s = snake[i];
      const pad = (i===0 ? 0 : 2);
      roundRect(ctx, s.x*cellSize+pad, s.y*cellSize+pad, cellSize-2*pad, cellSize-2*pad, 4, true);
    }
  }

  function roundRect(ctx, x, y, w, h, r, fill){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    if (fill) ctx.fill();
    else ctx.stroke();
  }

  function loop(t){
    if (!lastTick) lastTick = t;
    const interval = 1000 / speed;
    const diff = t - lastTick;
    if (running && diff >= interval){
      lastTick = t;
      step();
    }
    render();
    requestAnimationFrame(loop);
  }

  // input
  window.addEventListener('keydown', e=>{
    const key = e.key;
    if (key === 'ArrowUp' || key === 'w' || key==='W') setDir(0,-1);
    if (key === 'ArrowDown' || key === 's' || key==='S') setDir(0,1);
    if (key === 'ArrowLeft' || key === 'a' || key==='A') setDir(-1,0);
    if (key === 'ArrowRight' || key === 'd' || key==='D') setDir(1,0);
    if (key === ' '){ running = !running; }
  });

  function setDir(x,y){
    // prevent reversing
    if (snake.length>1 && snake[0].x + x === snake[1].x && snake[0].y + y === snake[1].y) return;
    dir = {x,y};
    running = true;
  }

  // touch control buttons
  ['left','up','down','right'].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', (ev)=>{ ev.preventDefault(); if(id==='left') setDir(-1,0); if(id==='right') setDir(1,0); if(id==='up') setDir(0,-1); if(id==='down') setDir(0,1); });
  });

  // start/pause buttons
  startBtn.addEventListener('click', ()=>{
    reset();
    running = true;
  });
  pauseBtn.addEventListener('click', ()=>{ running = !running; pauseBtn.textContent = running ? 'Pause' : 'Resume'; });

  // initial
  initBoard();
  requestAnimationFrame(loop);

  // handle resize
  window.addEventListener('resize', ()=>{ initBoard(); });

})();
</script>
</body>
</html>
